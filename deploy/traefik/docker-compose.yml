# ============================================================
# Vocero CRM — Ruta C: detrás de un Traefik que YA existe en el VPS
# (p. ej. el de la plantilla n8n de Hostinger), sin Caddy.
#
# Traefik descubre la app por etiquetas y le saca el certificado con su propio
# resolver. La app se une a la red de ese Traefik (TRAEFIK_NETWORK) además de
# la red privada del proyecto, donde vive su Postgres.
#
# Uso (desde la raíz del repo, con el .env de la raíz):
#   docker compose -f deploy/traefik/docker-compose.yml --env-file .env up -d --build
#
# Variables extra en .env (además de las de .env.example):
#   DOMAIN               crm.tudominio.com
#   TRAEFIK_NETWORK      red del Traefik existente (default n8n_default)
#   TRAEFIK_CERTRESOLVER resolver ACME del Traefik (default mytlschallenge)
#   VOCERO_ROUTER        nombre único del router; cambia por instancia (default vocero)
# ============================================================
name: ${COMPOSE_PROJECT_NAME:-vocero-crm}

services:
  app:
    image: vocero-crm-local:${VOCERO_ROUTER:-vocero}
    build:
      context: ../..
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
    restart: unless-stopped
    environment:
      APP_BASE_URL: ${APP_BASE_URL}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/vocero
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v25.0}
      OPENROUTER_API_TOKEN: ${OPENROUTER_API_TOKEN:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENROUTER_JUDGE_MODEL: ${OPENROUTER_JUDGE_MODEL:-}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-}
      AGENT_COALESCE_MS: ${AGENT_COALESCE_MS:-6000}
      CHANNELS: ${CHANNELS:-}
      AGENDA: ${AGENDA:-}
      ATRIBUCION: ${ATRIBUCION:-}
      BOT_API_KEY: ${BOT_API_KEY:-}
      BRAIN_HEALTH_URL: ${BRAIN_HEALTH_URL:-}
      BRAIN_DISPATCH_URL: ${BRAIN_DISPATCH_URL:-}
    volumes:
      - vocero_app_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-n8n_default}
      - traefik.http.routers.${VOCERO_ROUTER:-vocero}.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.${VOCERO_ROUTER:-vocero}.entrypoints=websecure
      - traefik.http.routers.${VOCERO_ROUTER:-vocero}.tls=true
      - traefik.http.routers.${VOCERO_ROUTER:-vocero}.tls.certresolver=${TRAEFIK_CERTRESOLVER:-mytlschallenge}
      - traefik.http.services.${VOCERO_ROUTER:-vocero}.loadbalancer.server.port=3000

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: vocero
    volumes:
      - vocero_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vocero"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  traefik:
    name: ${TRAEFIK_NETWORK:-n8n_default}
    external: true

volumes:
  vocero_pg:
  vocero_app_data:
